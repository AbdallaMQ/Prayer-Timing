<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prayer time</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap');
        </style>


    <style>
        *{margin: 0;
        padding: 0;}
        body{
            background:linear-gradient(45deg,#441752,#1B1833);
            direction: rtl;
        }
        section{
            height: 100vh;
        }
        .topsection{
            margin:0 50px 20px 50px;
        }
        .topsection h1{
            width: auto;
            margin: 0px;
            padding: 0px;
            font-family:'Readex Pro' ;
            font-weight: 400;
            font-size: 130px;
            color: white;
        }
        .topsection #date{
            margin: 30px 0px;
            font-size: 25px;
            font-weight: bold;
            color: white;
        }
        .topsection select{
            display: block;
            width: 30%;
            padding: 5px;
            margin:auto;
            margin-bottom: 20px;
            border-radius: 10px;
            background: none;
            font-size: 22px;
            font-family:'Readex Pro' ;
            color: rgb(180, 116, 116);
            box-shadow: 1px 1px 3px black;
        }

/*------------------------------------------------------*/
        #datasection{
            width: 95%;
            height: 30%;
            margin: auto;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-around;
            align-items: flex-start;
        }
        #datasection div{
            background-color: white;
            border-radius: 10px;
            height: 90%;
            box-shadow: 3px 3px 5px black;
            flex-grow: 0.2;
        }
        #datasection div h1{
            background-color: #5d2c6d;
            padding: 10px;
            color: white;
            font-family: 'Readex Pro';
            font-weight: 200;
        }
        #datasection div p{
            text-align: center;
            margin-top: 10%;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: 700;
            font-size: 40px;
        }

        @media (max-width:500px){
            .topsection h1{
                font-size: 80px;
            }
            .topsection #date{
                font-size: 15px;
            }
            .topsection select{
                font-size: 10px;
            }
            #datasection div{
                height: 50%;
                border-radius: 5px;
            }
            #datasection div h1{
                font-size: 20px;
            }
            #datasection div p{
                font-size: 20px;
            }
        }
    </style>

    <script src="node_modules/axios/dist/axios.min.js"></script>
</head>
<body>
    <section>
        <div class="topsection">
            <h1 id="heading"></h1>
            <div id="date"></div>
            <select name="" id="selections" onchange="setTheTimes(this.value)">
            </select>
            <hr>
        </div>

        <div id="datasection">
            <div >
                <h1>الفجر</h1>
                <p id="1"></p>
            </div>
            <div >
                <h1>الشروق</h1>
                <p id="2"></p>
            </div>
            <div >
                <h1>الظهر</h1>
                <p id="3"></p>
            </div>
            <div >
                <h1>العصر</h1>
                <p id="4"></p>
            </div>
            <div >
                <h1>المغرب</h1>
                <p id="5"></p>
            </div >
            <div >
                <h1>العشاء</h1>
                <p id="6"></p>
            </div>
        </div>
    </section>
    <script src="city_array.js"></script>
    <script src="script.js"></script>
</body>
</html>
